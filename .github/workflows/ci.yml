name: CI

on: [pull_request]

jobs:
  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the clang-format configuration of the coding guidelines
        run: curl -fsSL https://raw.githubusercontent.com/dice-group/tentris-cpp-coding-guidelines/main/.clang-format -o .clang-format
      - name: Install clang-format
        run: pip install clang-format==23.1.3
      - name: Check the formatting
        run: clang-format --dry-run -Werror $(git ls-files '*.hpp' '*.cpp')

  build:
    strategy:
      fail-fast: false
      matrix:
        config:
          - name: linux-x64-clang-19
            os: ubuntu-24.04
            cxx: clang++-19
          - name: linux-x64-clang-20-sanitize
            os: ubuntu-24.04
            cxx: clang++-20
            cxx-flags: "-fsanitize=address,undefined"

          - name: linux-x64-gcc-14
            os: ubuntu-24.04
            cxx: g++-14
            cxx-flags: -Werror
          - name: linux-x64-gcc-14-sanitize
            os: ubuntu-24.04
            cxx: g++-14
            cxx-flags: "-fsanitize=address,undefined"

    name: ${{matrix.config.name}}
    runs-on: ${{matrix.config.os}}
    steps:
      # setup env
      - name: Add repos for gcc and clang
        uses: dice-group/cpp-conan-release-reusable-workflow/.github/actions/setup_apt@v2.1.1

      - name: Install tools
        run: |
          sudo apt-get install -y python3 python3-pip

      - name: Get minimum cmake version
        uses: lukka/get-cmake@v4.4.2
        with:
          cmakeVersion: 3.24

      - name: Install compiler
        id: install_cc
        uses: rlalik/setup-cpp-compiler@v2
        with:
          compiler: ${{ matrix.config.cxx }}

      - name: Install mold
        uses: rui314/setup-mold@v1

      - name: Configure conan
        uses: dice-group/cpp-conan-release-reusable-workflow/.github/actions/configure_conan@v2.1.1

      - name: add conan user
        run: |
          conan remote add -f dice-group https://conan.dice-research.org/artifactory/api/conan/tentris
          conan remote add -f branch-packages https://conan.tentris.io/artifactory/api/conan/tentris

      - name: Cache conan data
        id: cache-conan
        uses: actions/cache@v6.1.0
        with:
          path: ~/.conan2/p
          key: ${{ matrix.config.os }}-${{ matrix.config.cxx }}-conan

      - name: Check out sources
        uses: actions/checkout@v7

      - name: Get dependency provider
        uses: dice-group/cpp-conan-release-reusable-workflow/.github/actions/add_conan_provider@v2.1.1

      - name: Configure CMake
        env:
          CC: ${{ steps.install_cc.outputs.cc }}
          CXX: ${{ steps.install_cc.outputs.cxx }}
          CXXFLAGS: ${{ matrix.config.cxx-flags }}
        run: cmake -B build_dir -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DBUILD_BENCHMARKS=ON -DCMAKE_PROJECT_TOP_LEVEL_INCLUDES=conan_provider.cmake

      - name: Build
        working-directory: build_dir
        run: cmake --build . --parallel 2

      - name: Run tests
        working-directory: build_dir
        run: ctest --parallel 2 --verbose

