name: Detect POBR diff

on:
  pull_request:
    branches: [ develop, main ]

concurrency:
  group: detect-pobr-diff-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect-pobr-diff:
    uses: dice-group/cpp-conan-release-reusable-workflow/.github/workflows/abi-diff.yml@v2.1.1
    with:
      os: ubuntu-24.04
      setup_tools: true
      cc: clang-19
      cxx: clang++-19
      base-branch: ${{ github.base_ref }}
      search-path: >
        include/dice/unordered_sparse/detail/sparse_growth_policy.hpp
        include/dice/unordered_sparse/detail/sparse_hash.hpp
        include/dice/unordered_sparse/detail/sparse_map.hpp
        include/dice/unordered_sparse/detail/sparse_set.hpp
      abi-version-header: include/dice/unordered_sparse/version.hpp
      abi-version-const: dice::unordered_sparse::pobr_version
    secrets:
      CONAN_CICD_ENDPOINT: ${{ secrets.CONAN_CICD_ENDPOINT }}