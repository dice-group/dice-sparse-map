  <text x="458" y="250" fill="#4b5563" font-size="11.5">flat</text>
  <rect x="516" y="241" width="11" height="11" fill="#a53393" opacity="0.85"/>
  <text x="532" y="250" fill="#4b5563" font-size="11.5">node</text>
  <text x="600" y="250" fill="#4b5563" font-size="11.5">time for the first four panels, peak bytes of the datastore on disk per entry for the last</text>
  <text x="8" y="272" fill="#4b5563" font-size="11.5">* keeps raw pointers into the datastore: it runs, but the datastore cannot be opened again at another address.</text>
  <text x="8" y="290" fill="#4b5563" font-size="11.5">std::string keeps raw pointers and its characters on the heap, so with string keys no map here can be opened again,</text>
  <text x="8" y="308" fill="#4b5563" font-size="11.5">and the disk usage counts the table, not the characters of the keys.</text>
</svg>
