  <rect fill="#ffffff" width="1132" height="282"/>
  <text x="8" y="20" fill="#111827" font-size="13.5" font-weight="600">relative to dice::sparse_map::sparse_map (sparsity medium), uint64_t keys, every map with metall's allocator (offset_ptr)</text>
  <text x="8" y="38" fill="#4b5563" font-size="12">geometric mean over one octave from 1,000,000 entries, mapped type size_t. Lower is better, 1.00 is level with dice::sparse_map::sparse_map.</text>
  <text x="8" y="56" fill="#4b5563" font-size="12">The maps are in a metall datastore on a local NVMe disk. Hash and key equality are the defaults of each map. Disk usage counts the blocks of the files, not the holes.</text>
  <text x="8" y="74" fill="#4b5563" font-size="12">Rows are sorted by the geomean of all five panels. A bar torn off at the right ran past the axis.</text>
